name: Release OTA assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Build embedded Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend into internal/server/dist
        working-directory: web
        run: |
          npm ci
          npm run build
          test -f ../internal/server/dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: internal/server/dist
          if-no-files-found: error

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }} ${{ matrix.binary }}
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: actond
            cgo: "0"
            tags: ""
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: embeddingd
            cgo: "1"
            tags: ORT
            ort: linux-x64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            binary: actond
            cgo: "0"
            tags: ""
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            binary: embeddingd
            cgo: "1"
            tags: ORT
            ort: linux-aarch64
            cross_cc: aarch64-linux-gnu-gcc
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary: actond
            cgo: "0"
            tags: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary: embeddingd
            cgo: "1"
            tags: ORT
            ort: win-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore embedded Web UI
        if: matrix.binary == 'actond'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/server/dist
      - name: Verify go:embed dist
        if: matrix.binary == 'actond'
        shell: bash
        run: test -f internal/server/dist/index.html
      - name: Install aarch64 cross-compiler
        if: matrix.cross_cc != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install MinGW (Windows CGO)
        if: matrix.binary == 'embeddingd' && matrix.goos == 'windows'
        run: choco install mingw -y --no-progress
      - name: Install ONNX Runtime (Linux)
        if: startsWith(matrix.ort, 'linux-')
        run: |
          set -euo pipefail
          ver="1.28.0"
          mkdir -p "$HOME/ort"
          curl -fsSL -o "$RUNNER_TEMP/ort.tgz" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ver}/onnxruntime-${{ matrix.ort }}-${ver}.tgz"
          tar -xzf "$RUNNER_TEMP/ort.tgz" -C "$HOME/ort" --strip-components=1
          echo "ORT_DIR=$HOME/ort" >> "$GITHUB_ENV"
      - name: Install ONNX Runtime (Windows)
        if: startsWith(matrix.ort, 'win-')
        shell: pwsh
        run: |
          $ver = "1.28.0"
          $zip = Join-Path $env:RUNNER_TEMP "ort.zip"
          $dest = Join-Path $env:RUNNER_TEMP "ort"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$ver/onnxruntime-${{ matrix.ort }}-$ver.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $inner = Get-ChildItem $dest -Directory | Where-Object { $_.Name -like "onnxruntime-*" } | Select-Object -First 1
          if (-not $inner) { throw "ONNX Runtime zip did not contain an onnxruntime-* directory" }
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_DIR=$($inner.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value "$($inner.FullName)\lib"
          Add-Content -Path $env:GITHUB_PATH -Value "$($inner.FullName)\bin"
      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          arch="x86_64"
          if [ "${{ matrix.goarch }}" = "arm64" ]; then arch="arm64"; fi
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          out="dist/${{ matrix.binary }}_v${version}_${arch}${ext}"
          mkdir -p dist

          extra=()
          if [ -n "${{ matrix.tags }}" ]; then extra+=(-tags "${{ matrix.tags }}"); fi

          if [ -n "${{ matrix.cross_cc }}" ]; then
            export CC="${{ matrix.cross_cc }}"
          fi
          if [ -n "${ORT_DIR:-}" ]; then
            export CGO_CFLAGS="-I${ORT_DIR}/include ${CGO_CFLAGS:-}"
            if [ "${{ matrix.goos }}" = "windows" ]; then
              export CGO_LDFLAGS="-L${ORT_DIR}/lib -lonnxruntime ${CGO_LDFLAGS:-}"
            else
              export CGO_LDFLAGS="-L${ORT_DIR}/lib -lonnxruntime -Wl,-rpath,\$ORIGIN ${CGO_LDFLAGS:-}"
            fi
          fi

          go build -trimpath \
            -ldflags "-s -w -X main.Version=${version} -X main.GitCommit=${GITHUB_SHA::7}" \
            "${extra[@]}" \
            -o "$out" \
            ./cmd/${{ matrix.binary }}
          ls -l "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "actond-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: "embeddingd-*"
          path: dist
          merge-multiple: true
      - name: Require named OTA assets including Windows embeddingd
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/actond_v${version}_x86_64"
          test -f "dist/embeddingd_v${version}_x86_64"
          test -f "dist/actond_v${version}_x86_64.exe"
          test -f "dist/embeddingd_v${version}_x86_64.exe"
          ( cd dist && sha256sum * > SHA256SUMS )
          echo "SHA256SUMS:" && cat dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
