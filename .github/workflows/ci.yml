name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Go vet, tests and coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests with coverage
        run: go test -count=1 -coverprofile=coverage.out ./internal/...

      - name: Enforce per-package coverage floors
        run: go run ./scripts/cover-gate.go coverage.out

  web:
    name: Web lint, i18n, tests and bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: i18n parity, hardcoded-text and emoji checks
        run: |
          npm run check:i18n
          npm run audit:i18n -- --fail
          npm run check:emoji

      - name: Unit tests
        run: npm test

      - name: Build and bundle budget
        run: |
          npm run build
          npm run check:bundle

  web-e2e:
    name: Web e2e (Playwright, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Not yet verified green on CI (screenshot baselines are platform specific),
    # so it reports but does not block merges. Remove continue-on-error once stable.
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e
