# ==============================================================================
# ActonOS GRUB Configuration (UEFI)
# Theme: Deep Ink (#130e30) & Hi-Yellow (#ffe228)
# ==============================================================================

set default=0
set timeout=15

# Graphical display & Splash screen
if [ -s /boot/grub/splash.png ]; then
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
    insmod png
    set gfxmode=auto
    insmod gfxterm
    terminal_output gfxterm
    background_image /boot/grub/splash.png
fi

# Colors: foreground/background
set color_normal=white/black
set color_highlight=yellow/blue

menuentry "⚡ ActonOS Live Appliance & 1-Click Install (Recommended)" --class actonos --class gnu-linux --class os {
    linux /live/vmlinuz boot=live components live-config username=acton hostname=acton console=tty1
    initrd /live/initrd.img
}

menuentry "🔍 ActonOS Live Diagnostic (Verbose Boot)" --class actonos --class gnu-linux --class os {
    linux /live/vmlinuz boot=live components live-config username=acton hostname=acton-live systemd.show_status=1 console=tty1
    initrd /live/initrd.img
}

menuentry "🛠️ ActonOS Safe Mode (Fail-safe Graphics)" --class actonos --class gnu-linux --class os {
    linux /live/vmlinuz boot=live components live-config nomodeset noapic noacpi nosmp console=tty1
    initrd /live/initrd.img
}
