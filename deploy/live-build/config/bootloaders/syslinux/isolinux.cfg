UI vesamenu.c32
PROMPT 0
TIMEOUT 150

MENU TITLE ActonOS Appliance Boot Menu
MENU BACKGROUND splash.png
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #ffffe228 #a0000000 std
MENU COLOR sel          7;37;40 #ff130e30 #ffffe228 all
MENU COLOR unsel        37;44   #ffffffff #a0000000 std
MENU COLOR help         37;40   #ff5f5c6e #a0000000 none
MENU COLOR timeout_msg  37;40   #ffffffff #00000000 none
MENU COLOR timeout      1;37;40 #ffffe228 #00000000 none

LABEL live
  MENU LABEL ^1. ActonOS Live Appliance & 1-Click Install
  MENU DEFAULT
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components live-config username=acton hostname=acton modprobe.blacklist=i2c_piix4 nomodeset console=tty0

LABEL diagnostic
  MENU LABEL ^2. ActonOS Live Diagnostic (Verbose Boot)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components live-config username=acton hostname=acton-live modprobe.blacklist=i2c_piix4 nomodeset systemd.show_status=1 console=tty0

LABEL failsafe
  MENU LABEL ^3. ActonOS Safe Mode (Fail-safe Graphics)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components live-config modprobe.blacklist=i2c_piix4 nomodeset noapic noacpi nosmp console=tty0
