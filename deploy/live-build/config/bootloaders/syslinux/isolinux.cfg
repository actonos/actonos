UI vesamenu.c32
PROMPT 0
TIMEOUT 150

MENU TITLE ActonOS Appliance Boot Menu
MENU BACKGROUND splash.png
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #ffffe228 #a0000000 std
MENU COLOR sel          7;37;40 #ff130e30 #ffffe228 all
MENU COLOR unsel        37;44   #ffffffff #a0000000 std
MENU COLOR help         37;40   #ff5f5c6e #a0000000 none
MENU COLOR timeout_msg  37;40   #ffffffff #00000000 none
MENU COLOR timeout      1;37;40 #ffffe228 #00000000 none

LABEL install
  MENU LABEL ^1. ActonOS 1-Click Automated Install (Recommended)
  MENU DEFAULT
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components quiet splash auto=true priority=critical file=/preseed/auto-install.cfg hostname=acton

LABEL live
  MENU LABEL ^2. ActonOS Live Hardware Diagnostic Mode
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components quiet splash hostname=acton-live

LABEL failsafe
  MENU LABEL ^3. ActonOS Safe Mode (Maintenance Console)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components nomodeset noapic noacpi nosmp nosplash
