# ==============================================================================
# ActonOS GRUB Configuration (PC BIOS & EFI)
# Theme: Deep Ink (#130e30) & Hi-Yellow (#ffe228)
# ==============================================================================

set default=0
set timeout=5

# Graphical display & Splash screen
if [ -s /boot/grub/splash.png ]; then
    insmod png
    insmod vbe
    insmod vga
    insmod video_bochs
    insmod video_cirrus
    set gfxmode=auto
    insmod gfxterm
    terminal_output gfxterm
    background_image /boot/grub/splash.png
fi

# Colors: foreground/background
# Normal: Canvas White on transparent Deep Ink
set color_normal=white/black
# Highlight: Hi-Yellow on deep violet
set color_highlight=yellow/blue

menuentry "⚡ ActonOS 1-Click Automated Install (Recommended)" --class actonos --class gnu-linux --class os {
    linux /live/vmlinuz boot=live components quiet splash auto=true priority=critical file=/preseed/auto-install.cfg hostname=acton
    initrd /live/initrd.img
}

menuentry "🔍 ActonOS Live Diagnostic & Hardware Inspection" --class actonos --class gnu-linux --class os {
    linux /live/vmlinuz boot=live components quiet splash hostname=acton-live
    initrd /live/initrd.img
}

menuentry "🛠️ ActonOS Safe Mode (Fail-safe Console)" --class actonos --class gnu-linux --class os {
    linux /live/vmlinuz boot=live components nomodeset noapic noacpi nosmp nosplash
    initrd /live/initrd.img
}

menuentry "🔄 Memory Diagnostic Tool (Memtest86+)" {
    linux16 /live/memtest
}
