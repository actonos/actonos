# ActonOS Automated Bare-metal Installer Preseed Configuration
# 3-Partition Scheme:
# 1. ESP (512MB, FAT32) -> /boot/efi
# 2. System Root (4GB, SquashFS / Read-Only Ext4) -> /
# 3. User Data (/data, Encrypted/Ext4, remaining disk) -> /data

d-i debian-installer/locale string en_US.UTF-8
d-i console-keymaps-at/keymap select us

# Branding Title
d-i cdrom-checker/next-cd string "ActonOS Appliance Installation"

# Networking & Hostname
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string acton
d-i netcfg/get_domain string local

# Default User Setup (acton:acton with sudo)
d-i passwd/root-login boolean true
d-i passwd/root-password password acton
d-i passwd/root-password-again password acton
d-i passwd/user-fullname string ActonOS Operator
d-i passwd/username string acton
d-i passwd/user-password password acton
d-i passwd/user-password-again password acton
d-i passwd/user-default-groups string sudo adm audio video dialout plugdev netdev systemd-journal
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# Automated 3-Partition Partitioning Recipe
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string                         \
      actonos-scheme ::                                      \
              512 512 512 fat32                              \
                      $primary{ }                            \
                      $bootable{ }                           \
                      method{ efi }                          \
                      format{ }                              \
              .                                              \
              4096 4096 4096 ext4                            \
                      $primary{ }                            \
                      method{ format }                       \
                      format{ }                              \
                      use_filesystem{ }                      \
                      filesystem{ ext4 }                     \
                      mountpoint{ / }                        \
              .                                              \
              10000 1000000 -1 ext4                          \
                      $primary{ }                            \
                      method{ format }                       \
                      format{ }                              \
                      use_filesystem{ }                      \
                      filesystem{ ext4 }                     \
                      mountpoint{ /data }                    \
              .

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Package installation & system services
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server network-manager bubblewrap systemd sudo curl wget ca-certificates
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

# Late Command: Provision /data hierarchy, permissions, and sudoers
d-i preseed/late_command string \
    in-target mkdir -p /data/config /data/workspace /data/logs /data/skills /data/releases /data/bin /data/.npm-global; \
    in-target chown -R acton:acton /data; \
    in-target chmod 755 /data; \
    in-target sh -c 'echo "acton ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/010_acton-nopasswd'; \
    in-target chmod 0440 /etc/sudoers.d/010_acton-nopasswd; \
    in-target systemctl enable embeddingd.service || true; \
    in-target systemctl enable actond.service || true

d-i finish-install/reboot_in_progress note
