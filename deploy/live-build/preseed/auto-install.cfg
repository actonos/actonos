# ActonOS Automated Bare-metal Installer Preseed Configuration
# 3-Partition Scheme:
# 1. ESP (512MB, FAT32) -> /boot/efi
# 2. System Root (4GB, SquashFS / Read-Only Ext4) -> /
# 3. User Data (/data, Encrypted/Ext4, remaining disk) -> /data

d-i debian-installer/locale string en_US.UTF-8
d-i console-keymaps-at/keymap select us

# Networking
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string acton
d-i netcfg/get_domain string local

# Automated 3-Partition Partitioning Recipe
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string                         \
      actonos-scheme ::                                      \
              512 512 512 fat32                              \
                      $primary{ }                            \
                      $bootable{ }                           \
                      method{ efi }                          \
                      format{ }                              \
              .                                              \
              4096 4096 4096 ext4                            \
                      $primary{ }                            \
                      method{ format }                       \
                      format{ }                              \
                      use_filesystem{ }                      \
                      filesystem{ ext4 }                     \
                      mountpoint{ / }                        \
              .                                              \
              10000 1000000 -1 ext4                          \
                      $primary{ }                            \
                      method{ format }                       \
                      format{ }                              \
                      use_filesystem{ }                      \
                      filesystem{ ext4 }                     \
                      mountpoint{ /data }                    \
              .

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Package installation & system service
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server network-manager bubblewrap systemd
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i finish-install/reboot_in_progress note
