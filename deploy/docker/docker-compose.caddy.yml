# ==============================================================================
# ActonOS with Caddy Automatic HTTPS Reverse Proxy
# Usage:
#   DOMAIN=agent.yourdomain.com docker compose -f deploy/docker/docker-compose.caddy.yml up -d
# ==============================================================================
services:
  actonos:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        VERSION: ${VERSION:-1.0.0}
    image: actonos/actonos:${VERSION:-latest}
    container_name: actonos-agent
    restart: unless-stopped
    volumes:
      - acton-data:/data
    environment:
      - RUNTIME_MODE=docker
      - PORT=8080
      - DATA_DIR=/data
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ACTONOS_SECRET_KEY=${ACTONOS_SECRET_KEY:-}
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2.0}"
          memory: "${MEM_LIMIT:-2048M}"
    pids_limit: 150
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: actonos-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    command:
      - /bin/sh
      - -c
      - |
        cat <<EOF > /etc/caddy/Caddyfile
        $${DOMAIN} {
            encode gzip zstd
            reverse_proxy actonos:8080
        }
        EOF
        caddy run --config /etc/caddy/Caddyfile
    depends_on:
      actonos:
        condition: service_healthy

volumes:
  acton-data:
    name: acton-data
    driver: local
  caddy-data:
    name: acton-caddy-data
    driver: local
  caddy-config:
    name: acton-caddy-config
    driver: local
